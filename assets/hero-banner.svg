<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="50%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Animated color gradient overlay -->
    <linearGradient id="colorOverlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08">
        <animate attributeName="stop-opacity" values="0.08;0.15;0.08" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.05">
        <animate attributeName="stop-opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08">
        <animate attributeName="stop-opacity" values="0.08;0.14;0.08" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Moving cinematic light -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-2;1;-2" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;3;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Secondary beam -->
    <linearGradient id="beam2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
      <animate attributeName="x1" values="3;-1;3" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="5;1;5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlowColor">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.39  0 0 0 0 0.4  0 0 0 0 0.95  0 0 0 0.6 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M 55 0 L 0 0 0 55" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <!-- Scanline -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Animated underline gradient -->
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Flowing particles filter -->
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="520" fill="url(#bg)"/>

  <!-- Color overlay -->
  <rect width="1600" height="520" fill="url(#colorOverlay)"/>

  <!-- Ambient glow -->
  <ellipse cx="800" cy="260" rx="520" ry="180" fill="#6366f1" opacity=".04" filter="url(#glowStrong)">
    <animate attributeName="rx" values="420;560;420" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".03;.07;.03" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- GRID -->
  <rect width="1600" height="520" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;55 55;0 0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- CINEMATIC LIGHT BEAM -->
  <rect x="-700" y="0" width="900" height="520" fill="url(#beam)" opacity=".35" transform="skewX(-18)">
    <animateTransform attributeName="transform" type="translate" values="-900 0;1800 0;-900 0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Secondary color beam -->
  <rect x="-700" y="0" width="900" height="520" fill="url(#beam2)" opacity=".25" transform="skewX(-18)">
    <animateTransform attributeName="transform" type="translate" values="1800 0;-900 0;1800 0" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- FLOATING ORBS -->
  <g opacity="0.4">
    <circle cx="200" cy="180" r="80" fill="#6366f1" opacity="0.08" filter="url(#glowStrong)">
      <animate attributeName="cx" values="200;260;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;140;180" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="300" r="100" fill="#06b6d4" opacity="0.06" filter="url(#glowStrong)">
      <animate attributeName="cx" values="1400;1340;1400" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;350;300" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- PARTICLES -->
  <g fill="#ffffff" filter="url(#particleGlow)">
    <circle cx="150" cy="120" r="2.5">
      <animate attributeName="cy" values="120;80;120" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="320" cy="380" r="2">
      <animate attributeName="cy" values="380;340;380" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1240" cy="140" r="2.5">
      <animate attributeName="cy" values="140;100;140" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;1;.1" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3.5;2" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1400" cy="350" r="2">
      <animate attributeName="cy" values="350;300;350" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="410" r="1.5">
      <animate attributeName="cy" values="410;370;410" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.9;.3" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="540" cy="100" r="1.5">
      <animate attributeName="cy" values="100;60;100" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Additional floating particles -->
    <circle cx="700" cy="450" r="1.8">
      <animate attributeName="cy" values="450;410;450" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.8;.1" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="80" r="2">
      <animate attributeName="cy" values="80;50;80" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.9;.15" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1150" cy="460" r="1.5">
      <animate attributeName="cy" values="460;430;460" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="300" r="1.8">
      <animate attributeName="cx" values="450;470;450" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.7;.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HORIZONTAL LIGHT -->
  <rect x="100" y="390" width="1400" height="1" fill="#ffffff" opacity=".15">
    <animate attributeName="x" values="100;0;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".05;.5;.05" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- TOP LABEL -->
  <g>
    <text x="800" y="145" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="17" letter-spacing="6">
      &lt; FULL-STACK DEVELOPER /&gt;
      <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
    </text>
    <!-- Decorative brackets -->
    <text x="555" y="145" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="17" opacity="0.6">
      &lt;
      <animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="1045" y="145" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="17" opacity="0.6">
      &gt;
      <animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- MAIN TITLE with color glow -->
  <text x="800" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="5" filter="url(#textGlowColor)">
    LUMINOUS HALDER ALEX
    <animate attributeName="opacity" values=".85;1;.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Animated underline beneath title -->
  <rect x="400" y="248" width="800" height="2" fill="url(#underline)" opacity="0.7"/>

  <!-- SUBTITLE -->
  <text x="800" y="285" text-anchor="middle" fill="#bdbdbd" font-family="monospace" font-size="18" letter-spacing="3">
    REACT • NEXT.JS • TYPESCRIPT • NODE.JS • UI/UX
    <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- STATUS -->
  <g transform="translate(800 345)">
    <circle cx="-95" cy="0" r="5" fill="#22c55e">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-95" cy="0" r="9" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="6;12;6" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0;.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-78" y="6" fill="#9ca3af" font-family="monospace" font-size="15" letter-spacing="2">
      ONLINE • BUILDING • LEARNING
    </text>
  </g>

  <!-- SCANLINE -->
  <rect x="0" y="-100" width="1600" height="80" fill="url(#scan)" opacity=".35">
    <animate attributeName="y" values="-100;520;-100" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- BOTTOM BORDER -->
  <rect x="180" y="430" width="1240" height="1" fill="#ffffff" opacity=".18"/>

  <!-- Animated bottom decorative line -->
  <rect x="300" y="440" width="1000" height="1" fill="url(#underline)" opacity="0.4"/>

  <text x="800" y="470" text-anchor="middle" fill="#666666" font-family="monospace" font-size="13" letter-spacing="4">
    THINK → DESIGN → BUILD → TEST → SHIP → REPEAT
    <animate attributeName="opacity" values=".4;.8;.4" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>