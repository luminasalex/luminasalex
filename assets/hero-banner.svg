<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02050d"/>
      <stop offset="35%" stop-color="#0b1220"/>
      <stop offset="70%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#010204"/>
    </linearGradient>

    <radialGradient id="halo1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#71DDE8" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#71DDE8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#71DDE8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B99CFF" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#B99CFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#B99CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="82%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>

  <ellipse cx="800" cy="260" rx="520" ry="180" fill="url(#halo1)" filter="url(#glow)">
    <animate attributeName="rx" values="480;560;480" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1200" cy="120" rx="300" ry="140" fill="url(#halo2)" filter="url(#glow)">
    <animate attributeName="cy" values="120;160;120" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <rect width="1600" height="520" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;52 52;0 0" dur="10s" repeatCount="indefinite"/>
  </rect>

  <rect x="-900" y="0" width="900" height="520" fill="url(#beam)" transform="skewX(-16)">
    <animateTransform attributeName="transform" type="translate" values="-900 0;1700 0;-900 0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g fill="#ffffff">
    <circle cx="170" cy="110" r="2.5"><animate attributeName="cy" values="110;80;110" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="370" r="2.5"><animate attributeName="cy" values="370;340;370" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="130" r="2.5"><animate attributeName="cy" values="130;90;130" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1405" cy="365" r="2.5"><animate attributeName="cy" values="365;325;365" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="430" r="2"><animate attributeName="cy" values="430;390;430" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="100" r="2"><animate attributeName="cy" values="100;70;100" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <path d="M 250 420 C 540 410, 760 350, 1150 420" fill="none" stroke="#8FE4FF" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M 300 370 C 530 330, 760 300, 1260 370" fill="none" stroke="#B99CFF" stroke-opacity="0.16" stroke-width="1.5"/>
  </g>

  <text x="800" y="145" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="17" letter-spacing="6">
    &lt; FULL-STACK DEVELOPER /&gt;
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/>
  </text>

  <text x="800" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="5" filter="url(#glow)">
    LUMINOUS HALDER ALEX
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.2s" repeatCount="indefinite"/>
  </text>

  <text x="800" y="282" text-anchor="middle" fill="#c9d9e8" font-family="monospace" font-size="18" letter-spacing="3">
    REACT • NEXT.JS • TYPESCRIPT • NODE.JS • UI/UX
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </text>

  <g transform="translate(800 335)">
    <circle cx="-95" cy="0" r="5" fill="#7AF7C4">
      <animate attributeName="r" values="4;8;4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-78" y="6" fill="#9ca3af" font-family="monospace" font-size="15" letter-spacing="2">
      ONLINE • BUILDING • LEARNING
    </text>
  </g>

  <rect x="0" y="-80" width="1600" height="90" fill="url(#scan)" opacity="0.4">
    <animate attributeName="y" values="-80;540;-80" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="180" y="430" width="1240" height="1" fill="#ffffff" opacity="0.2"/>
  <text x="800" y="465" text-anchor="middle" fill="#757f8c" font-family="monospace" font-size="13" letter-spacing="4">
    THINK → DESIGN → BUILD → TEST → SHIP → REPEAT
  </text>
</svg>
