<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="40" y1="110" x2="860" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFFB2"/>
      <stop offset="0.5" stop-color="#9AE6FF"/>
      <stop offset="1" stop-color="#BFA3FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="876" height="196" rx="18" fill="#0B1020"/>
  <rect x="12" y="12" width="876" height="196" rx="18" stroke="#1F2A3D" stroke-width="2"/>

  <g opacity="0.22" stroke="#DDE7FF" stroke-width="1">
    <path d="M40 60H860"/>
    <path d="M40 160H860"/>
    <path d="M40 110H860"/>
  </g>

  <path d="M40 110 C120 110, 150 70, 210 110 S310 150, 390 110 S490 70, 560 110 S680 150, 860 110" fill="none" stroke="url(#waveGradient)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="8 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <g fill="#7CFFB2" filter="url(#glow)">
    <circle r="7">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#motionPath"/>
      </animateMotion>
    </circle>
    <circle r="7">
      <animateMotion dur="4s" begin="0.8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#motionPath"/>
      </animateMotion>
    </circle>
    <circle r="7">
      <animateMotion dur="4s" begin="1.6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#motionPath"/>
      </animateMotion>
    </circle>
  </g>

  <path id="motionPath" d="M40 110 C120 110, 150 70, 210 110 S310 150, 390 110 S490 70, 560 110 S680 150, 860 110" fill="none" stroke="transparent"/>

  <g fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">
    <text x="82" y="52">BUILD</text>
    <text x="362" y="52">LEARN</text>
    <text x="600" y="52">SHIP</text>
  </g>
</svg>
